[project]
name = "ev-battery-management-sim"
version = "0.1.0"
description = "EV battery-management simulation: cell models, SOC/SOH estimation, thermal and Kaggle-schema validation"
requires-python = ">=3.9"
dependencies = ["numpy", "pandas"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
plots = ["matplotlib"]

[tool.setuptools]
packages = ["bms", "bms.datasets"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
